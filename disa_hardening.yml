#==============================================================
# DISA STIG Hardening Ansible Playbook — RHEL 9
#==============================================================
# This playbook applies DISA STIG security controls to RHEL 9
# instances that complement the OpenSCAP remediation run during
# cloud-init. It provides readable, auditable hardening controls.
#
# Usage:
#   ansible-playbook -i inventory.ini disa_hardening.yml
#
# Prerequisites:
#   - Target hosts running RHEL 9
#   - Ansible 2.12+ with ansible.posix collection
#==============================================================

---
- name: Apply DISA STIG Hardening to RHEL 9
  hosts: all
  become: true
  gather_facts: true

  vars:
    # DISA STIG configuration variables
    stig_password_max_days: 60
    stig_password_min_days: 1
    stig_password_min_len: 15
    stig_password_warn_age: 7
    stig_max_login_retries: 3
    stig_client_alive_interval: 600
    stig_client_alive_count_max: 0
    stig_login_banner: |
      **********************************************************************
      *                        WARNING NOTICE                              *
      **********************************************************************
      This is a U.S. Government computer system. Unauthorized access is
      prohibited. By accessing this system, you consent to monitoring
      and recording. Unauthorized use may result in criminal prosecution.
      **********************************************************************

  tasks:

    #----------------------------------------------------------
    # 1. SELinux — Enforce mandatory access control
    #----------------------------------------------------------
    - name: Ensure SELinux is set to enforcing mode
      ansible.posix.selinux:
        policy: targeted
        state: enforcing
      tags: ['selinux', 'stig']

    - name: Ensure SELinux policy is configured
      lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUXTYPE='
        line: 'SELINUXTYPE=targeted'
        state: present
      tags: ['selinux', 'stig']

    #----------------------------------------------------------
    # 2. Auditd — File integrity and system call auditing
    #----------------------------------------------------------
    - name: Install auditd
      dnf:
        name: audit
        state: present
      tags: ['auditd', 'stig']

    - name: Ensure auditd is enabled and running
      systemd:
        name: auditd
        enabled: yes
        state: started
      tags: ['auditd', 'stig']

    - name: Configure auditd settings for STIG compliance
      lineinfile:
        path: /etc/audit/auditd.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^max_log_file\s*=', line: 'max_log_file = 100' }
        - { regexp: '^max_log_file_action\s*=', line: 'max_log_file_action = ROTATE' }
        - { regexp: '^space_left\s*=', line: 'space_left = 50' }
        - { regexp: '^space_left_action\s*=', line: 'space_left_action = SYSLOG' }
        - { regexp: '^action_mail_acct\s*=', line: 'action_mail_acct = root' }
        - { regexp: '^admin_space_left\s*=', line: 'admin_space_left = 25' }
        - { regexp: '^admin_space_left_action\s*=', line: 'admin_space_left_action = HALT' }
        - { regexp: '^disk_full_action\s*=', line: 'disk_full_action = HALT' }
        - { regexp: '^disk_error_action\s*=', line: 'disk_error_action = HALT' }
      tags: ['auditd', 'stig']

    - name: Deploy STIG audit watch rules
      copy:
        content: |
          # DISA STIG audit watch rules
          -w /etc/passwd -p wa -k identity
          -w /etc/group -p wa -k identity
          -w /etc/gshadow -p wa -k identity
          -w /etc/shadow -p wa -k identity
          -w /etc/security/opasswd -p wa -k identity
          -w /etc/hosts -p wa -k system_config
          -w /etc/sysconfig/ -p wa -k system_config
          -w /etc/inittab -p wa -k system_config
          -w /etc/init.d/ -p wa -k system_config
          -w /etc/cron.d/ -p wa -k cron
          -w /etc/cron.daily/ -p wa -k cron
          -w /etc/cron.hourly/ -p wa -k cron
          -w /etc/cron.monthly/ -p wa -k cron
          -w /etc/cron.weekly/ -p wa -k cron
          -w /etc/crontab -p wa -k cron
          -w /var/log/audit/ -p wa -k audit_log
          -w /etc/audit/ -p wa -k audit_config
          -w /etc/libaudit.conf -p wa -k audit_config
          -w /etc/audisp/ -p wa -k audit_config
          -w /etc/localtime -p wa -k time_change
          -w /etc/profile -p wa -k system_config
          -w /etc/bashrc -p wa -k system_config
          -w /etc/csh.cshrc -p wa -k system_config
          -w /etc/csh.login -p wa -k system_config
          -w /etc/fstab -p wa -k system_config
          -w /etc/issue -p wa -k system_config
          -w /etc/issue.net -p wa -k system_config
          -w /etc/motd -p wa -k system_config
          -w /etc/ntp.conf -p wa -k time_change
          -w /etc/chrony.conf -p wa -k time_change
        dest: /etc/audit/rules.d/stig.rules
        owner: root
        group: root
        mode: '0640'
      notify: restart auditd
      tags: ['auditd', 'stig']

    - name: Ensure audit rules are immutable (requires reboot to change)
      lineinfile:
        path: /etc/audit/rules.d/stig.rules
        line: '-e 2'
        state: present
      notify: restart auditd
      tags: ['auditd', 'stig']

    #----------------------------------------------------------
    # 3. SSH Hardening — STIG-compliant configuration
    #----------------------------------------------------------
    - name: Harden SSH server configuration
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        validate: /usr/sbin/sshd -t -f %s
      loop:
        - { regexp: '^#?Protocol\s', line: 'Protocol 2' }
        - { regexp: '^#?PermitRootLogin\s', line: 'PermitRootLogin no' }
        - { regexp: '^#?MaxAuthTries\s', line: "MaxAuthTries {{ stig_max_login_retries }}" }
        - { regexp: '^#?ClientAliveInterval\s', line: "ClientAliveInterval {{ stig_client_alive_interval }}" }
        - { regexp: '^#?ClientAliveCountMax\s', line: "ClientAliveCountMax {{ stig_client_alive_count_max }}" }
        - { regexp: '^#?AllowTcpForwarding\s', line: 'AllowTcpForwarding no' }
        - { regexp: '^#?X11Forwarding\s', line: 'X11Forwarding no' }
        - { regexp: '^#?AllowAgentForwarding\s', line: 'AllowAgentForwarding no' }
        - { regexp: '^#?PermitEmptyPasswords\s', line: 'PermitEmptyPasswords no' }
        - { regexp: '^#?PasswordAuthentication\s', line: 'PasswordAuthentication no' }
        - { regexp: '^#?PubkeyAuthentication\s', line: 'PubkeyAuthentication yes' }
        - { regexp: '^#?GatewayPorts\s', line: 'GatewayPorts no' }
        - { regexp: '^#?TCPKeepAlive\s', line: 'TCPKeepAlive no' }
        - { regexp: '^#?Compression\s', line: 'Compression delayed' }
        - { regexp: '^#?LoginGraceTime\s', line: 'LoginGraceTime 60' }
        - { regexp: '^#?AllowUsers\s', line: '# AllowUsers — configure per environment' }
      notify: restart sshd
      tags: ['ssh', 'stig']

    #----------------------------------------------------------
    # 4. Password Policy — PAM and login.defs
    #----------------------------------------------------------
    - name: Configure password quality in login.defs
      lineinfile:
        path: /etc/login.defs
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^PASS_MAX_DAYS\s', line: "PASS_MAX_DAYS {{ stig_password_max_days }}" }
        - { regexp: '^PASS_MIN_DAYS\s', line: "PASS_MIN_DAYS {{ stig_password_min_days }}" }
        - { regexp: '^PASS_MIN_LEN\s', line: "PASS_MIN_LEN {{ stig_password_min_len }}" }
        - { regexp: '^PASS_WARN_AGE\s', line: "PASS_WARN_AGE {{ stig_password_warn_age }}" }
        - { regexp: '^UMASK\s', line: 'UMASK 077' }
        - { regexp: '^LOGIN_RETRIES\s', line: "LOGIN_RETRIES {{ stig_max_login_retries }}" }
      tags: ['password', 'stig']

    - name: Install pam_pwquality for password complexity
      dnf:
        name: libpwquality
        state: present
      tags: ['password', 'stig']

    - name: Configure password complexity requirements
      lineinfile:
        path: /etc/security/pwquality.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^minlen\s', line: "minlen = {{ stig_password_min_len }}" }
        - { regexp: '^dcredit\s', line: 'dcredit = -1' }
        - { regexp: '^ucredit\s', line: 'ucredit = -1' }
        - { regexp: '^lcredit\s', line: 'lcredit = -1' }
        - { regexp: '^ocredit\s', line: 'ocredit = -1' }
        - { regexp: '^difok\s', line: 'difok = 8' }
        - { regexp: '^minclass\s', line: 'minclass = 4' }
        - { regexp: '^maxrepeat\s', line: 'maxrepeat = 3' }
        - { regexp: '^maxclassrepeat\s', line: 'maxclassrepeat = 4' }
        - { regexp: '^enforce_for_root\s', line: 'enforce_for_root' }
      tags: ['password', 'stig']

    #----------------------------------------------------------
    # 5. Login Banner — DoD Required Notice
    #----------------------------------------------------------
    - name: Deploy DoD login banner
      copy:
        content: "{{ stig_login_banner }}"
        dest: "{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - /etc/issue
        - /etc/issue.net
        - /etc/motd
      tags: ['banner', 'stig']

    #----------------------------------------------------------
    # 6. Chrony — NTP Time Synchronization
    #----------------------------------------------------------
    - name: Install chrony
      dnf:
        name: chrony
        state: present
      tags: ['chrony', 'stig']

    - name: Configure chrony for AWS NTP
      copy:
        content: |
          # AWS NTP via IMDS
          server 169.254.169.123 prefer iburst
          makestep 1.0 3
          hwtimestamp *
          driftfile /var/lib/chrony/drift
          allow 127.0.0.1
          logdir /var/log/chrony
          rtcsync
        dest: /etc/chrony.conf
        owner: root
        group: root
        mode: '0644'
      notify: restart chronyd
      tags: ['chrony', 'stig']

    - name: Enable and start chronyd
      systemd:
        name: chronyd
        enabled: yes
        state: started
      tags: ['chrony', 'stig']

    #----------------------------------------------------------
    # 7. Sysctl — Kernel Network Security Parameters
    #----------------------------------------------------------
    - name: Configure sysctl parameters for STIG compliance
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/99-stig.conf
      loop:
        - { name: 'net.ipv4.ip_forward', value: '0' }
        - { name: 'net.ipv4.conf.all.send_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.send_redirects', value: '0' }
        - { name: 'net.ipv4.conf.all.accept_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.accept_redirects', value: '0' }
        - { name: 'net.ipv4.conf.all.accept_source_route', value: '0' }
        - { name: 'net.ipv4.conf.default.accept_source_route', value: '0' }
        - { name: 'net.ipv4.conf.all.log_martians', value: '1' }
        - { name: 'net.ipv4.conf.default.log_martians', value: '1' }
        - { name: 'net.ipv4.conf.all.accept_rp_filter', value: '1' }
        - { name: 'net.ipv4.conf.default.accept_rp_filter', value: '1' }
        - { name: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
        - { name: 'net.ipv4.icmp_ignore_bogus_error_responses', value: '1' }
        - { name: 'net.ipv4.tcp_syncookies', value: '1' }
        - { name: 'net.ipv6.conf.all.accept_ra', value: '0' }
        - { name: 'net.ipv6.conf.default.accept_ra', value: '0' }
        - { name: 'kernel.randomize_va_space', value: '2' }
        - { name: 'fs.suid_dumpable', value: '0' }
      tags: ['sysctl', 'stig']

    #----------------------------------------------------------
    # 8. Firewall — firewalld Configuration
    #----------------------------------------------------------
    - name: Install firewalld
      dnf:
        name: firewalld
        state: present
      tags: ['firewall', 'stig']

    - name: Enable and start firewalld
      systemd:
        name: firewalld
        enabled: yes
        state: started
      tags: ['firewall', 'stig']

    - name: Remove unnecessary firewall services
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: yes
        state: disabled
      loop:
        - dhcpv6-client
        - cockpit
      tags: ['firewall', 'stig']

    - name: Reload firewalld
      command: firewall-cmd --reload
      changed_when: false
      tags: ['firewall', 'stig']

    #----------------------------------------------------------
    # 9. Package Management — Remove insecure services
    #----------------------------------------------------------
    - name: Remove unnecessary/insecure packages
      dnf:
        name:
          - rsh-server
          - rsh
          - ypserv
          - ypbind
          - talk
          - talk-server
          - telnet-server
          - telnet
          - tftp-server
          - tftp
          - xinetd
          - talk
          - rwho
          - rwall
        state: absent
      tags: ['packages', 'stig']

    - name: Ensure dnf-automatic security updates are installed
      dnf:
        name: dnf-automatic
        state: present
      tags: ['packages', 'stig']

    - name: Configure dnf-automatic for security updates
      lineinfile:
        path: /etc/dnf/automatic.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^upgrade_type\s*=', line: 'upgrade_type = security' }
        - { regexp: '^apply_updates\s*=', line: 'apply_updates = yes' }
        - { regexp: '^emit_via\s*=', line: 'emit_via = stdio' }
      tags: ['packages', 'stig']

    - name: Enable dnf-automatic timer
      systemd:
        name: dnf-automatic.timer
        enabled: yes
        state: started
      tags: ['packages', 'stig']

    #----------------------------------------------------------
    # 10. OpenSCAP — Final STIG Scan Report
    #----------------------------------------------------------
    - name: Install OpenSCAP and SCAP Security Guide
      dnf:
        name:
          - openscap-scanner
          - scap-security-guide
        state: present
      tags: ['openscap', 'stig']

    - name: Create report directory
      file:
        path: /var/log/openscap-reports
        state: directory
        owner: root
        group: root
        mode: '0750'
      tags: ['openscap', 'stig']

    - name: Run final OpenSCAP STIG scan
      command: >
        oscap xccdf eval
        --profile stig
        --results /var/log/openscap-reports/final-results.xml
        --report /var/log/openscap-reports/final-report.html
        /usr/share/xml/scap/ssg/content/ssg-rhel9-ds.xml
      register: oscap_result
      failed_when: false
      tags: ['openscap', 'stig']

    - name: Display OpenSCAP scan summary
      debug:
        msg: |
          OpenSCAP STIG scan completed.
          Exit code: {{ oscap_result.rc }}
          Report: /var/log/openscap-reports/final-report.html
          Review the report and address any remaining findings.
      tags: ['openscap', 'stig']

  #----------------------------------------------------------
  # Handlers
  #----------------------------------------------------------
  handlers:
    - name: restart auditd
      systemd:
        name: auditd
        state: restarted

    - name: restart sshd
      systemd:
        name: sshd
        state: restarted

    - name: restart chronyd
      systemd:
        name: chronyd
        state: restarted
